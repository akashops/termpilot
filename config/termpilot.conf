# ==============================================================================
# TermPilot Configuration File (termpilot.conf)
# Open-Source Universal Terminal Intelligence Suite
# Location: ~/.termpilot/config/termpilot.conf
# ==============================================================================

# [General Settings]
TERMPILOT_ENABLED=true
TERMPILOT_THEME="cyber_neon"          # cyber_neon | enterprise_dark | classic | minimal
TERMPILOT_TELEMETRY=false             # 100% Offline & Private (No tracking)

# [Auto-Suggestion Engine]
TERMPILOT_AUTOSUGGEST_ENABLED=true
TERMPILOT_SUGGESTION_COLOR="242"      # ANSI 256 color (242: Dim Grey, 33: Cyan, 240: Subtle)
TERMPILOT_SUGGESTION_STRATEGY="frecency" # frecency | history | db | hybrid
TERMPILOT_ACCEPT_KEY="arrow"          # arrow (Right Arrow →) | tab | ctrl-f

# [Smart Error & Auto-Correction]
TERMPILOT_ERROR_SUGGEST_ENABLED=true
TERMPILOT_MAX_SUGGESTIONS=3
TERMPILOT_FUZZY_THRESHOLD=3           # Maximum Levenshtein distance
TERMPILOT_INTERACTIVE_FIX=true        # Enable 1-key quick execution: [1], [2], [3]

# [Deep Context Analyzers]
TERMPILOT_DEEP_CONTEXT_GIT=true       # Analyze git subcommands & branches
TERMPILOT_DEEP_CONTEXT_DOCKER=true    # Analyze docker/docker-compose arguments
TERMPILOT_DEEP_CONTEXT_SYSTEMD=true   # Analyze systemctl / journalctl units
TERMPILOT_DEEP_CONTEXT_K8S=true       # Analyze kubectl resources & pods
TERMPILOT_PATH_AWARE_ENABLED=true     # Local directory file context (e.g. ./script.sh)

# [Enterprise Security & Guardrails]
TERMPILOT_SECURITY_GUARD=true         # Warn on destructive commands (rm -rf /, dd, chmod 777)
TERMPILOT_SECRET_MASKING=true         # Mask API keys/passwords in command history

# [Package Management]
TERMPILOT_SUGGEST_PACKAGE_INSTALL=true
TERMPILOT_AUTO_REFRESH_DB=true
